[package]
name = "lusa"
version = "2.2.0"
edition = "2021"
description = "Lusa — a Lua-flavoured dynamic language written in Rust, with optional ownership (borrow/clone) and friendly Rust-style diagnostics."
license = "MIT"

[[bin]]
name = "lusa"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
