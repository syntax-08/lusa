name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test before release (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full test suite
        run: cargo test --all-targets -- --test-threads=1

  build:
    name: build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            package: lusa-setup.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            package: lusa-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            package: lusa-linux-arm64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: macos-arm64
            package: lusa-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lusa.exe" dist/lusa.exe
          Copy-Item setup/install-lusa.cmd dist/install-lusa.cmd
          Copy-Item setup/install-lusa.ps1 dist/install-lusa.ps1
          Copy-Item setup/README.txt dist/README.txt
          Copy-Item README.md dist/PROJECT.md
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/*.md dist/docs/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}" -Force

      - name: Package Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/docs
          cp "target/${{ matrix.target }}/release/lusa" dist/lusa
          cp README.md dist/README.md
          cp docs/*.md dist/docs/
          chmod +x dist/lusa
          tar -czf "${{ matrix.package }}" -C dist .

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate curated release notes
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          grep -Fq "## Impact Introduction" "$notes"
          grep -Fq "## Feature Highlights" "$notes"
          grep -Fq "## How to Use" "$notes"
      - name: List assets
        run: ls -lh dist
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
